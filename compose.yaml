services :
  server :
    image: deplix
    container_name: deplix_server
    ports : 
    - "8000:8000"

  db:
    image: postgres:18
    container_name: deplix_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data: