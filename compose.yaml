services :
  server :
    image: deplix
    container_name: deplix_server
    ports : 
    - "8000:8000"

  db:
    image: postgres:18
    container_name: deplix_db
    environment:
      POSTGRES_DB: deplix
      POSTGRES_USER: deplix
      POSTGRES_PASSWORD: deplix_dev_password
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql

  volumes:
    postgres_data: