services :
  server :
    image: deplix
    build: .
    container_name: deplix_server
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_PORT: ${POSTGRES_PORT}
      POSTGRES_HOST: ${POSTGRES_HOST}
    ports: 
    - "8000:8000"
    volumes:
    - .:/app

  db:
    image: postgres:18
    container_name: deplix_db
    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    ports:
      - "5432:5432"
    
    volumes:
      - postgres_data:/var/lib/postgresql

  redis:
    image: redis:8
    container_name: deplix_redis
    ports:
    - "6379:6379"

volumes:
  postgres_data: